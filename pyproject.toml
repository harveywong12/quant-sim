[project]
name = "qsim"
version = "0.1.0"
description = "Hybrid refactor core for quant-sim"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "apscheduler>=3.10",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "requests>=2.31",
    "tushare>=1.4",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qsim*"]
exclude = ["tests*", "data*", "artifacts*"]

[tool.setuptools.package-data]
"qsim.services.web" = ["templates/*.html", "static/*.js", "static/*.css", "static/licenses/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
